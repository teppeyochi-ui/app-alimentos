# Publica os apps no GitHub Pages.
# Classificador de Camarão: https://teppeyochi-ui.github.io/app-alimentos/
# Dita (ditado por voz):    https://teppeyochi-ui.github.io/app-alimentos/ditado-voz/
# Configuração única: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar apps no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'classificador-camarao/**'
      - 'ditado-voz/**'
      - '.github/workflows/pages-classificador.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Não publica se as regras ou tabelas quebrarem os testes do motor.
      - name: Testes do motor
        working-directory: classificador-camarao
        run: node teste-motor.js

      - name: Testes do núcleo do Dita
        working-directory: ditado-voz
        run: node teste-nucleo.js

      # Só os arquivos do app vão para o site (testes, planilha e capturas ficam fora).
      - name: Montar o site
        run: |
          mkdir -p _site
          cd classificador-camarao
          cp index.html styles.css app.js core.js sw.js manifest.webmanifest ../_site/
          cp -r icones ../_site/
          mkdir -p ../_site/ditado-voz
          cd ../ditado-voz
          cp index.html styles.css app.js core.js sw.js manifest.webmanifest ../_site/ditado-voz/
          cp -r icones ../_site/ditado-voz/
          touch ../_site/.nojekyll

      # Tenta ligar o Pages (fonte "GitHub Actions") se ainda não estiver ligado.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
